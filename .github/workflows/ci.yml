name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip uv==0.11.32
          uv lock --check
          python -m pip install -e ".[dev]"

      - name: Validate capability batch manifest
        run: |
          uaek capability batch benchmarks/manifests/capability-batch.ci-example.json \
            --dry-run \
            --output /tmp/uaek-capability-manifest-validation.json

      - name: Validate UAEK 0.3 evidence contracts
        run: |
          uaek evidence campaign validate \
            benchmarks/manifests/evidence-campaign.ci-example.json \
            --output /tmp/uaek-evidence-campaign-validation.json
          uaek evidence campaign aggregate benchmarks/evidence/fixtures/campaign/*.json \
            --output /tmp/uaek-evidence-campaign-summary.json
          uaek evidence campaign run \
            benchmarks/manifests/evidence-campaign.ci-example.json \
            --dry-run --output /tmp/uaek-evidence-campaign-plan.json
          uaek evidence cost validate benchmarks/evidence/fixtures/cost/cost-ledger.json \
            --output /tmp/uaek-evidence-cost-validation.json
          uaek evidence cost aggregate benchmarks/evidence/fixtures/cost/cost-ledger.json \
            --output /tmp/uaek-evidence-cost-summary.json
          for artifact in benchmarks/evidence/fixtures/sessions/*.json; do
            uaek evidence session validate "$artifact" \
              --output "/tmp/$(basename "$artifact")"
          done
          uaek evidence session aggregate benchmarks/evidence/fixtures/sessions/*.json \
            --output /tmp/uaek-evidence-session-summary.json
          uaek evidence baseline validate benchmarks/evidence/fixtures/baseline.json \
            --output /tmp/uaek-evidence-baseline-validation.json

      - name: Validate active headline consistency
        run: python scripts/check_headline_consistency.py

      - name: Lint
        run: python -m ruff check src api mcp tests scripts

      - name: Check formatting
        run: python -m ruff format --check src api mcp tests scripts

      - name: Typecheck
        run: python -m mypy src api mcp

      - name: Test with coverage floor
        run: |
          python -m pytest --cov=src --cov=api --cov=mcp --cov-report=term-missing \
            --cov-report=json:/tmp/uaek-coverage.json --cov-fail-under=75
          python scripts/check_supported_coverage.py /tmp/uaek-coverage.json

      - name: Audit credential-free evidence index
        run: |
          uaek audit --iterations 1 \
            --evidence-root benchmarks/evidence/fixtures \
            --output /tmp/uaek-evidence-audit.json

  dependency-audit:
    name: Dependency audit (core + all extras)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install locked dependency tooling
        run: |
          python -m pip install --upgrade pip uv==0.11.32
          uv lock --check

      - name: Audit core dependencies
        run: |
          uv export --no-dev --no-emit-project --format requirements-txt --output-file /tmp/uaek-core.txt
          uvx pip-audit==2.10.1 -r /tmp/uaek-core.txt

      - name: Audit all supported extras
        run: |
          uv export --all-extras --no-dev --no-emit-project --format requirements-txt --output-file /tmp/uaek-all.txt
          uvx pip-audit==2.10.1 -r /tmp/uaek-all.txt

  release-gate:
    name: Release gate (wheel + install + smoke)
    needs: [quality, dependency-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/

      - name: Validate wheel metadata
        run: |
          python - <<'PY'
          import tomllib
          import zipfile
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          wheels = sorted(Path("dist").glob("uaek-*.whl"))
          assert len(wheels) == 1, wheels

          with zipfile.ZipFile(wheels[0]) as wheel:
              metadata_files = [
                  name for name in wheel.namelist() if name.endswith(".dist-info/METADATA")
              ]
              assert len(metadata_files) == 1, metadata_files
              metadata = wheel.read(metadata_files[0]).decode("utf-8")

          assert f"Name: {project['name']}" in metadata
          assert f"Version: {project['version']}" in metadata
          assert f"Requires-Python: {project['requires-python']}" in metadata
          PY

      - name: Install wheel in clean venv
        run: |
          python -m venv /tmp/release-venv
          wheel="$(
            python - <<'PY'
          from pathlib import Path

          wheels = sorted(Path("dist").glob("uaek-*.whl"))
          assert len(wheels) == 1, wheels
          print(wheels[0])
          PY
          )"
          /tmp/release-venv/bin/pip install "$wheel"

      - name: CLI smoke test
        run: |
          /tmp/release-venv/bin/uaek --version
          /tmp/release-venv/bin/uaek --help

      - name: API and MCP module compatibility smoke test
        run: |
          /tmp/release-venv/bin/python - <<'PY'
          import api.server
          import mcp.server
          PY
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            '{"jsonrpc":"2.0","id":3,"method":"shutdown","params":{}}' \
            | /tmp/release-venv/bin/python -m mcp.server \
            > /tmp/release-mcp-responses.jsonl
          /tmp/release-venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          responses = [
              json.loads(line)
              for line in Path("/tmp/release-mcp-responses.jsonl").read_text().splitlines()
              if line.strip()
          ]
          assert responses[0]["result"]["serverInfo"]["name"] == "uaek"
          tools = {tool["name"] for tool in responses[1]["result"]["tools"]}
          assert {"uaek_verify", "uaek_effort", "uaek_memory_query"}.issubset(tools)
          PY

      - name: MCP console-script smoke test (installed wheel)
        run: |
          cd /tmp
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            '{"jsonrpc":"2.0","id":3,"method":"shutdown","params":{}}' \
            | /tmp/release-venv/bin/uaek-mcp \
            > /tmp/release-mcp-console-responses.jsonl
          /tmp/release-venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          responses = [
              json.loads(line)
              for line in Path("/tmp/release-mcp-console-responses.jsonl").read_text().splitlines()
              if line.strip()
          ]
          assert [response["id"] for response in responses] == [1, 2, 3]
          assert responses[0]["result"]["serverInfo"]["name"] == "uaek"
          tools = {tool["name"] for tool in responses[1]["result"]["tools"]}
          assert tools == {
              "uaek_verify",
              "uaek_effort",
              "uaek_workflow_create",
              "uaek_workflow_add_task",
              "uaek_workflow_execute",
              "uaek_memory_add",
              "uaek_memory_query",
              "uaek_memory_delete",
              "uaek_memory_compress",
          }
          assert responses[2] == {"jsonrpc": "2.0", "id": 3, "result": {}}
          PY

      - name: Benchmark quick (from wheel)
        run: |
          /tmp/release-venv/bin/uaek benchmark --suite quick --iterations 1 \
            --output /tmp/release-benchmarks

      - name: Benchmark adversarial (from wheel)
        run: |
          /tmp/release-venv/bin/uaek benchmark --suite adversarial --iterations 1 \
            --output /tmp/release-benchmarks

      - name: Capability manifest dry-run (from wheel)
        run: |
          /tmp/release-venv/bin/uaek capability batch \
            benchmarks/manifests/capability-batch.ci-example.json \
            --dry-run \
            --output /tmp/release-benchmarks/manifest-validation.json

      - name: Audit (from wheel)
        run: |
          /tmp/release-venv/bin/uaek audit --iterations 1 \
            --evidence-root benchmarks/evidence/fixtures \
            --output /tmp/release-benchmarks

      - name: Validate audit semantics
        run: |
          /tmp/release-venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path("/tmp/release-benchmarks/audit.json").read_text())
          assert audit["errors"] == [], audit["errors"]
          assert audit["gates"]["audit_passed"] is True, audit["gates"]
          assert audit["gates"]["evidence_consistency_passed"] is True, audit["gates"]
          assert audit["evidence_index"]["consistency"]["status"] == "pass"
          assert audit["evidence_index"]["v0_3"]["status"] == "valid"
          assert audit["evidence_index"]["capability"]["held_out"]["enabled_in_current_grader"] is True
          for key, proposition in audit["propositions"].items():
              if key == "all_propositions_complete":
                  continue
              assert proposition["status"] != "incomplete", (key, proposition)
          PY

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-evidence
          path: /tmp/release-benchmarks/
          retention-days: 90

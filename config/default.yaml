# Effective UAEK configuration. Load precedence: $UAEK_CONFIG > this file > built-in defaults.
# This file mirrors the built-in defaults (aligned 2026-09-08) so loading it is behavior-neutral.
# Edit deliberately: workflow.safe_actions is an execution allowlist (security-relevant).
uaek:
  version: "0.3.0.dev1"
  memory:
    storage_path: ".uaek/harness-memory"
    default_layer: "l2"
  workflow:
    default_type: "sequential"
    safe_actions:
      - noop
      - echo
      - concat
      - sum
      - effort
      - fail
  skills:
    search_paths:
      - "skills"
  logging:
    enabled: true
    file_path: null
  verification:
    lint_command: ".venv/bin/python -m ruff check src api mcp tests"
    typecheck_command: ".venv/bin/python -m mypy src api mcp"
    test_command: ".venv/bin/python -m pytest"
